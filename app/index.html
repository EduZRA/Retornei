<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Retornei · Protótipo do app</title>
  <meta name="theme-color" content="#123B4A">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app/app.css">
</head>
<body>
  <p class="proto-note">Protótipo com dados de exemplo. Tudo volta ao início quando a página recarrega.</p>

  <div class="device">
    <header class="app-top">
      <img src="/marca/logo-solto.svg" alt="" width="34" height="34">
      <div>
        <p class="biz" id="bizName">Barbearia do Zé</p>
        <p class="today" id="todayLabel"></p>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <nav class="tabs" aria-label="Seções do app">
      <button class="tab is-active" data-tab="hoje" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Hoje</span>
      </button>
      <button class="tab" data-tab="clientes" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2 .8 3 3 3 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Clientes</span>
      </button>
      <button class="tab tab-add" data-action="novo-atendimento" type="button" aria-label="Registrar atendimento">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
      </button>
      <button class="tab" data-tab="resultados" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        <span>Resultados</span>
      </button>
      <button class="tab" data-tab="ajustes" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Ajustes</span>
      </button>
    </nav>

    <!-- Painel que sobe de baixo (mensagem, novo atendimento, novo cliente) -->
    <div class="sheet-backdrop" id="backdrop" hidden></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
      <div class="sheet-grip" aria-hidden="true"></div>
      <h2 id="sheetTitle"></h2>
      <div id="sheetBody"></div>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden>
      <img src="/marca/mascote-comemora.svg" alt="" width="44" height="44">
      <p id="toastText"></p>
    </div>
  </div>

  <script src="/app/app.js" defer></script>
</body>
</html>
